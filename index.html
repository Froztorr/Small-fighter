<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12131a">
<title>Small Fighter</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0b0c10;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;overflow:hidden}.box{max-width:620px;padding:24px;text-align:center;line-height:1.5}.title{font-size:28px;font-weight:800;letter-spacing:2px}.sub{opacity:.7;margin-top:8px}.err{margin-top:16px;color:#ff8a6a;white-space:pre-wrap;text-align:left;font:12px/1.45 ui-monospace,Menlo,monospace;background:#171923;padding:14px;border-radius:8px}.spin{width:34px;height:34px;border-radius:50%;border:3px solid #333;border-top-color:#ffd34a;margin:18px auto;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box" id="loading"><div class="title">SMALL FIGHTER</div><div class="spin"></div><div class="sub">Loading movement-upgraded build…</div></div>
<script>
"use strict";

const ORIGINAL_SOURCES = [
    "https://raw.githubusercontent.com/Froztorr/Small-fighter/f49232fbc0f97fda482859122d0082992ad4a8e6/index.html",
    "https://cdn.jsdelivr.net/gh/Froztorr/Small-fighter@f49232fbc0f97fda482859122d0082992ad4a8e6/index.html",
    "https://fastly.jsdelivr.net/gh/Froztorr/Small-fighter@f49232fbc0f97fda482859122d0082992ad4a8e6/index.html"
];

function replaceOnce(source, oldText, newText) {
    if (!source.includes(oldText)) throw new Error("Patch anchor not found: " + oldText.slice(0, 100));
    return source.replace(oldText, newText);
}

async function fetchOriginal() {
    const errors = [];
    for (const url of ORIGINAL_SOURCES) {
        try {
            const res = await fetch(url, { cache: "no-store" });
            if (!res.ok) throw new Error("HTTP " + res.status);
            const text = await res.text();
            if (!text.includes("class Fighter") || !text.includes("const CFG")) throw new Error("Unexpected file contents");
            return text;
        } catch (err) {
            errors.push(url + " -> " + (err && err.message || err));
        }
    }
    throw new Error("All original-game sources failed:\n" + errors.join("\n"));
}

function applyMovementUpgrade(html) {
    html = replaceOnce(html,
`            double-tap forward to run`,
`            double-tap forward to run &middot; X + A throws at close range`);

    html = replaceOnce(html,
`    roundTime: 99,
    roundsToWin: 2
};`,
`    roundTime: 99,
    roundsToWin: 2,
    prejumpFrames: 4,
    landingFrames: 6,
    throwRange: 72,
    throwDamage: 90,
    throwTechWindow: 8,
    dashFrames: 10,
    dashBackInvuln: 5,
    walkAccel: 0.45,
    runAccel: 0.8,
    backAccel: 0.38
};`);

    html = replaceOnce(html,
`        this.aiTimer = 0; this.aiPlan = "approach";
    }`,
`        this.aiTimer = 0; this.aiPlan = "approach";
        this.jumpDirX = 0;
        this.throwTechTimer = 0;
    }`);

    html = replaceOnce(html,
`    // Frame-data helpers, with the style's global speed multiplier applied.`,
`    approachVelocity(target, accel) {
        if (this.vx < target) this.vx = Math.min(target, this.vx + accel);
        else if (this.vx > target) this.vx = Math.max(target, this.vx - accel);
    }

    applyGroundFriction(amount = CFG.friction) {
        if (Math.abs(this.vx) <= CFG.minSpeed) { this.vx = 0; return; }
        this.vx -= sign(this.vx) * amount;
    }

    startJump(dirX) {
        this.state = "prejump";
        this.stateT = 0;
        this.jumpDirX = dirX;
        this.vx *= 0.55;
    }

    land() {
        this.y = CFG.groundY;
        this.vy = 0;
        this.airborne = false;
        this.state = "landing";
        this.stateT = 0;
        fxDust(this.x, CFG.groundY, this.dir, 4);
    }

    startDash(dir) {
        this.state = dir > 0 ? "dashForward" : "dashBack";
        this.stateT = 0;
        this.vx = this.dir * dir * this.S.dashSpeed;
        fxDust(this.x, CFG.groundY, this.dir * -dir, 6);
    }

    canSpendMeter(cost) { return this.meter >= cost; }

    spendMeter(cost) {
        if (this.meter < cost) return false;
        this.meter -= cost;
        return true;
    }

    wantsThrow(inp) { return inp.pressed.LP && (inp.btn.LK || inp.pressed.LK); }

    tryThrow(opp) {
        if (Math.abs(opp.x - this.x) > CFG.throwRange) return false;
        if (!this.grounded || !opp.grounded) return false;
        if (["launched", "down", "wakeup"].includes(opp.state)) return false;
        if (opp.throwTechTimer > 0) {
            this.vx = -this.dir * 4;
            opp.vx = this.dir * 4;
            fxBlock((this.x + opp.x) / 2, this.skel.j.chest.y);
            announce("TECH!");
            return true;
        }
        opp.hp = Math.max(0, opp.hp - CFG.throwDamage);
        opp.vx = this.dir * 9;
        opp.vy = -7;
        opp.y -= 1;
        opp.state = "launched";
        opp.airborne = true;
        opp.fall = CFG.fallKO;
        this.meter = Math.min(100, this.meter + 6);
        shake(8);
        fxHit(opp.skel.j.chest.x, opp.skel.j.chest.y, true);
        return true;
    }

    // Frame-data helpers, with the style's global speed multiplier applied.`);

    html = replaceOnce(html,
`        if (this.dashTap.timer > 0) this.dashTap.timer--;
        if (this.comboTimer > 0)`,
`        if (this.dashTap.timer > 0) this.dashTap.timer--;
        if (this.throwTechTimer > 0) this.throwTechTimer--;
        if (this.comboTimer > 0)`);

    html = replaceOnce(html,
`            case "idle": case "walk": case "run": case "crouch": case "block":
                this.neutral(inp, opp); break;
            case "air":`,
`            case "idle": case "walk": case "run": case "crouch": case "block":
                this.neutral(inp, opp); break;
            case "prejump":
                this.vx *= 0.65;
                if (++this.stateT >= CFG.prejumpFrames) this.jump(this.jumpDirX);
                break;
            case "landing":
                this.applyGroundFriction(CFG.friction * 1.35);
                if (++this.stateT >= CFG.landingFrames) this.state = "idle";
                break;
            case "dashForward":
                if (++this.stateT >= CFG.dashFrames) this.state = "brake";
                break;
            case "dashBack":
                this.invuln = this.stateT < CFG.dashBackInvuln;
                if (++this.stateT >= CFG.dashFrames) this.state = "brake";
                break;
            case "air":`);

    html = replaceOnce(html,
`        // ---- specials take priority ----
        const sp = this.findSpecial(inp);`,
`        // ---- throws / specials take priority ----
        if (this.wantsThrow(inp)) { this.throwTechTimer = CFG.throwTechWindow; if (this.tryThrow(opp)) return; }
        const sp = this.findSpecial(inp);`);

    html = replaceOnce(html,
`        if (np >= 7) { this.jump(np === 8 ? 0 : (np === 9 ? this.dir : -this.dir)); return; }`,
`        if (np >= 7) { this.startJump(np === 8 ? 0 : (np === 9 ? this.dir : -this.dir)); return; }`);

    html = replaceOnce(html,
`            this.vx = -this.dir * this.S.dashSpeed;
            this.state = "brake"; this.stateT = 0;
            fxDust(this.x, CFG.groundY, -this.dir, 6);`,
`            this.startDash(-1);`);

    html = replaceOnce(html,
`            this.vx = this.dir * this.S.runSpeed;`,
`            this.approachVelocity(this.dir * this.S.runSpeed, CFG.runAccel);`);

    html = replaceOnce(html,
`        if (fwd) { this.vx = this.dir * this.S.walkSpeed; this.state = "walk"; }
        else if (back) { this.vx = -this.dir * this.S.backSpeed; this.state = "walk"; }
        else { this.vx *= 0.5; this.state = this.blocking ? "block" : "idle"; }`,
`        if (fwd) { this.approachVelocity(this.dir * this.S.walkSpeed, CFG.walkAccel); this.state = "walk"; }
        else if (back) { this.approachVelocity(-this.dir * this.S.backSpeed, CFG.backAccel); this.state = "walk"; }
        else { this.applyGroundFriction(CFG.friction); this.state = this.blocking ? "block" : "idle"; }`);

    html = replaceOnce(html,
`        if (this.grounded) {
            this.state = "idle";
            this.airborne = false;
            fxDust(this.x, CFG.groundY, this.dir, 4);
        }`,
`        if (this.grounded) {
            this.land();
        }`);

    html = replaceOnce(html,
`            if (this.airborne && this.state === "air") { this.state = "idle"; this.airborne = false; }`,
`            if (this.airborne && this.state === "air") this.land();`);

    html = replaceOnce(html,
`                    this.vx -= sign(this.vx) * CFG.friction;
                    if (Math.abs(this.vx) < CFG.minSpeed) this.vx = 0;`,
`                    this.applyGroundFriction(CFG.friction);`);

    html = replaceOnce(html,
`        const stride = this.state === "run" ? this.S.runStride : this.S.stride;
        if (this.grounded && (this.state === "walk" || this.state === "run")) {`,
`        const stride = (this.state === "run" || this.state === "dashForward") ? this.S.runStride : this.S.stride;
        if (this.grounded && ["walk", "run", "dashForward", "dashBack"].includes(this.state)) {`);

    html = replaceOnce(html,
`            case "walk": case "run": {`,
`            case "walk": case "run": case "dashForward": case "dashBack": {`);

    html = replaceOnce(html,
`                const run = this.state === "run";`,
`                const run = this.state === "run" || this.state === "dashForward" || this.state === "dashBack";`);

    html = replaceOnce(html,
`            case "crouch":
                t.crouch = 52;`,
`            case "prejump":
                t.crouch = 42; t.lean = 10; t.head = -8;
                t.lHip = 18; t.lKn = -68; t.rHip = -12; t.rKn = -62;
                t.lSh = 28; t.lEl = 104; t.rSh = 16; t.rEl = 118;
                blend = 0.5;
                break;
            case "landing":
                t.crouch = 36; t.lean = 10; t.head = -8;
                t.lHip = 20; t.lKn = -70; t.rHip = -12; t.rKn = -62;
                t.lSh = 32; t.lEl = 104; t.rSh = 18; t.rEl = 116;
                blend = 0.55;
                break;
            case "crouch":
                t.crouch = 52;`);

    // Show the user this is the upgraded runtime without changing gameplay UI.
    html = html.replace("<title>Small Fighter</title>", "<title>Small Fighter - Movement Upgrade</title>");
    return html;
}

(async function bootPatchedGame() {
    try {
        const original = await fetchOriginal();
        const patched = applyMovementUpgrade(original);
        document.open();
        document.write(patched);
        document.close();
    } catch (err) {
        document.getElementById("loading").innerHTML = `<div class="title">Small Fighter failed to load</div><div class="sub">The upgraded loader could not fetch or patch the base game.</div><div class="err"></div>`;
        document.querySelector(".err").textContent = String(err && err.stack || err);
    }
})();
</script>
</body>
</html>
