<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Fighter Prototype - Stickman Edition</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #222; overflow: hidden;
            touch-action: none; font-family: sans-serif;
        }
        #gameCanvas {
            width: 100vw; height: 100vh; display: block;
        }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; justify-content: space-between;
            align-items: flex-end; padding: 20px; box-sizing: border-box;
        }
        .control-group { pointer-events: auto; }

        /* Joystick (Left) */
        #joystick-zone {
            position: relative; width: 150px; height: 150px;
            margin-bottom: 20px; margin-left: 20px;
        }
        #joy-base {
            position: absolute; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.2); border: 3px solid rgba(255,255,255,0.4);
            border-radius: 50%; top: 15px; left: 15px;
        }
        #joy-stick {
            position: absolute; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.8); border-radius: 50%;
            top: 50px; left: 50px; transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Action Buttons (Right) */
        #action-buttons {
            position: relative; width: 200px; height: 200px;
            margin-bottom: 20px; margin-right: 20px;
        }
        .action-btn {
            position: absolute; width: 55px; height: 55px; border-radius: 50%;
            background: rgba(255, 50, 50, 0.5); border: 2px solid rgba(255, 255, 255, 0.5);
            color: white; font-weight: bold; font-size: 18px;
            display: flex; justify-content: center; align-items: center; user-select: none;
        }
        .action-btn:active { background: rgba(255, 255, 255, 0.6) !important; color: black; }
        
        #btn-y { top: 0; left: 75px; background: rgba(255, 200, 0, 0.5); }
        #btn-x { top: 65px; left: 10px; background: rgba(50, 50, 255, 0.5); }
        #btn-b { top: 65px; left: 140px; background: rgba(255, 50, 50, 0.5); }
        #btn-a { top: 130px; left: 75px; background: rgba(50, 255, 50, 0.5); }
        #btn-special { top: 140px; left: 150px; width: 65px; height: 65px; background: rgba(200, 50, 255, 0.5); font-size: 14px;}

        /* HUD */
        #hud {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; pointer-events: none;
        }
        .health-bar-container {
            width: 40%; height: 25px; background: rgba(0,0,0,0.5); border: 2px solid white;
        }
        .health-fill { height: 100%; background: #00ff00; width: 100%; transition: width 0.1s; }
        .player-name { color: white; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        .cd-bar { height: 5px; background: #c832ff; width: 100%; margin-top: 5px; }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="1280" height="720"></canvas>
    
    <div id="hud">
        <div style="width: 40%;">
            <div class="player-name">P1: YOU</div>
            <div class="health-bar-container"><div id="p1-health" class="health-fill"></div></div>
            <div id="p1-sp-cd" class="cd-bar"></div>
        </div>
        <div style="width: 40%; text-align: right;">
            <div class="player-name">P2: DUMMY</div>
            <div class="health-bar-container"><div id="p2-health" class="health-fill"></div></div>
        </div>
    </div>

    <div id="ui-layer">
        <div id="joystick-zone" class="control-group">
            <div id="joy-base">
                <div id="joy-stick"></div>
            </div>
        </div>
        <div id="action-buttons" class="control-group">
            <div class="action-btn" id="btn-y" data-key="y">Y</div>
            <div class="action-btn" id="btn-x" data-key="x">X</div>
            <div class="action-btn" id="btn-b" data-key="b">B</div>
            <div class="action-btn" id="btn-a" data-key="a">A</div>
            <div class="action-btn" id="btn-special" data-key="special">SP</div>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GRAVITY = 0.8;
const GROUND_Y = 650;
const FPS = 60;

const input = { a: false, b: false, x: false, y: false, special: false };
const joystick = { x: 0, y: 0, active: false };

const joyZone = document.getElementById('joystick-zone');
const joyStick = document.getElementById('joy-stick');
const joyBase = document.getElementById('joy-base');
const maxRadius = 45;

function handleJoy(e) {
    e.preventDefault();
    if (e.type === 'touchend' || e.type === 'mouseup') {
        joystick.active = false;
        joystick.x = 0; joystick.y = 0;
        joyStick.style.transform = `translate(-50%, -50%)`;
        return;
    }
    joystick.active = true;
    let clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let clientY = e.touches ? e.touches[0].clientY : e.clientY;
    let rect = joyBase.getBoundingClientRect();
    
    let centerX = rect.left + rect.width / 2;
    let centerY = rect.top + rect.height / 2;
    
    let dx = clientX - centerX;
    let dy = clientY - centerY;
    let distance = Math.sqrt(dx * dx + dy * dy);
    
    if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
    }
    
    joyStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    joystick.x = dx / maxRadius;
    joystick.y = dy / maxRadius;
}

joyZone.addEventListener('touchstart', handleJoy, {passive: false});
joyZone.addEventListener('touchmove', handleJoy, {passive: false});
joyZone.addEventListener('touchend', handleJoy, {passive: false});
joyZone.addEventListener('mousedown', handleJoy);
document.addEventListener('mousemove', (e) => { if (joystick.active) handleJoy(e); });
document.addEventListener('mouseup', handleJoy);

document.querySelectorAll('.action-btn').forEach(btn => {
    const press = (e) => { e.preventDefault(); input[btn.dataset.key] = true; };
    const release = (e) => { e.preventDefault(); input[btn.dataset.key] = false; };
    btn.addEventListener('touchstart', press);
    btn.addEventListener('mousedown', press);
    btn.addEventListener('touchend', release);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);
});

window.addEventListener('keydown', (e) => {
    switch(e.key.toLowerCase()) {
        case 'j': input.a = true; break;
        case 'k': input.b = true; break;
        case 'u': input.x = true; break;
        case 'i': input.y = true; break;
        case ' ': input.special = true; break;
        case 'w': joystick.y = -1; break;
        case 's': joystick.y = 1; break;
        case 'a': joystick.x = -1; break;
        case 'd': joystick.x = 1; break;
    }
});
window.addEventListener('keyup', (e) => {
    switch(e.key.toLowerCase()) {
        case 'j': input.a = false; break;
        case 'k': input.b = false; break;
        case 'u': input.x = false; break;
        case 'i': input.y = false; break;
        case ' ': input.special = false; break;
        case 'w': case 's': joystick.y = 0; break;
        case 'a': case 'd': joystick.x = 0; break;
    }
});

function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }
function toRad(deg) { return deg * Math.PI / 180; }

// Authentic Stickman Stance (Guarding, bent knees, lean forward)
const DEFAULT_POSE = {
    lShoulder: -80, lElbow: -70,
    rShoulder: -30, rElbow: -90,
    lHip: -30, lKnee: 40,
    rHip: 20, rKnee: 30,
    trunkTilt: 10
};

class HumanoidFighter {
    constructor(x, id, color, isAI = false) {
        this.id = id;
        this.isAI = isAI;
        this.x = x;
        this.y = GROUND_Y;
        this.vx = 0;
        this.vy = 0;
        this.hp = 100;
        this.maxHp = 100;
        this.color = color;
        this.facingRight = (id === 'P1');
        
        // Stickman proportions
        this.sizes = {
            head: 15, trunkH: 60,
            upperArm: 35, lowerArm: 35, 
            upperLeg: 40, lowerLeg: 40
        };

        this.pose = { ...DEFAULT_POSE };
        this.targetPose = { ...DEFAULT_POSE };
        this.globalRotation = 0; 
        
        this.state = 'idle';
        this.stateTimer = 0;
        this.hasHit = false; 
        this.spCooldown = 0;
        this.spMaxCooldown = FPS * 5; 
        
        this.limbs = { lHand: {x:0,y:0}, rHand: {x:0,y:0}, lFoot: {x:0,y:0}, rFoot: {x:0,y:0} };
        this.bodyBox = { x: 0, y: 0, w: 0, h: 0 };
    }

    update(opponent) {
        if (this.hp <= 0) {
            if (this.state !== 'dead') {
                this.state = 'dead';
                this.vy = -6; 
                this.vx = this.facingRight ? -4 : 4; 
            }
            
            // Lying flat on ground pose
            this.targetPose = {
                lShoulder: 160, lElbow: 0,
                rShoulder: 180, rElbow: 0,
                lHip: 90, lKnee: 0,
                rHip: 70, rKnee: 0,
                trunkTilt: 90 
            };
            
            this.globalRotation = 0;
            this.vy += GRAVITY;
            this.x += this.vx;
            this.y += this.vy;
            
            if (this.y > GROUND_Y) {
                this.y = GROUND_Y;
                this.vy = 0;
                this.vx = 0; 
            }
            
            for (let joint in this.pose) {
                this.pose[joint] = lerp(this.pose[joint], this.targetPose[joint], 0.15);
            }
            return; 
        }

        if (this.spCooldown > 0) this.spCooldown--;

        let jx = 0;
        let jy = 0;

        // Player vs Independent AI logic
        if (!this.isAI) {
            jx = joystick.x;
            jy = joystick.y;
        } else if (this.state !== 'spin') {
            let dist = opponent.x - this.x;
            if (Math.abs(dist) > 65) {
                jx = dist > 0 ? 0.5 : -0.5; // Walk towards player
            } else {
                jx = 0;
                if (Math.random() < 0.04 && !this.isAttacking()) {
                    const attacks = ['punchA', 'punchB', 'kickX', 'kickY'];
                    this.startAttack(attacks[Math.floor(Math.random() * attacks.length)], 25);
                }
            }
            // Decoupled Jump Logic
            if (Math.random() < 0.015 && this.y === GROUND_Y) {
                jy = -1; 
                jx = dist > 0 ? 0.6 : -0.6; 
            }
        }

        if (this.state !== 'spin' && this.y >= GROUND_Y) {
            if (opponent.x > this.x + 20) this.facingRight = true;
            else if (opponent.x < this.x - 20) this.facingRight = false;
        }

        if (this.state === 'idle' || this.state === 'walk' || (this.y < GROUND_Y && !this.isAttacking())) {
            if (Math.abs(jx) > 0.1 && this.y === GROUND_Y) {
                this.vx = jx * 6;
                this.state = 'walk';
            } else if (this.y === GROUND_Y) {
                this.vx = 0;
                this.state = 'idle';
            }

            if (jy < -0.5 && this.y === GROUND_Y) {
                this.vy = -16;
                this.vx = jx * 8; 
                this.y -= 1;
            }

            if (!this.isAI) {
                if (input.special && this.spCooldown === 0) {
                    this.state = 'spin';
                    this.stateTimer = FPS * 3; 
                    this.hasHit = false;
                } else if (input.a) { this.startAttack('punchA', 15); }
                else if (input.b) { this.startAttack('punchB', 30); }
                else if (input.x) { this.startAttack('kickX', 20); }
                else if (input.y) { this.startAttack('kickY', 35); }
            }
        }

        this.updatePoses(jx);

        if (this.state === 'spin') {
            this.vx = jx * 10;
            this.vy = jy * 10;
            this.globalRotation += (this.facingRight ? 15 : -15);
            this.checkHit(opponent);
            this.stateTimer--;
            if (this.stateTimer <= 0) {
                this.state = 'idle';
                this.globalRotation = 0;
                this.spCooldown = this.spMaxCooldown;
            }
        } else {
            this.globalRotation = 0;
            this.vy += GRAVITY;
        }

        this.x += this.vx;
        this.y += this.vy;

        if (this.y > GROUND_Y) {
            this.y = GROUND_Y;
            this.vy = 0;
            if (this.state !== 'spin' && !this.isAttacking()) this.vx = 0; 
        }
        if (this.x < 30) this.x = 30;
        if (this.x > canvas.width - 30) this.x = canvas.width - 30;

        for (let joint in this.pose) {
            this.pose[joint] = lerp(this.pose[joint], this.targetPose[joint], 0.3);
        }

        if (this.isAttacking()) {
            this.stateTimer--;
            this.checkHit(opponent);
            if (this.stateTimer <= 0) this.state = 'idle';
        }

        this.bodyBox = {
            x: this.x - 20,
            y: this.y - 120,
            w: 40, h: 120
        };

        if(this.id === 'P1') {
            const cdBar = document.getElementById('p1-sp-cd');
            cdBar.style.width = `${(1 - (this.spCooldown / this.spMaxCooldown)) * 100}%`;
        }
    }

    startAttack(attackName, duration) {
        this.state = attackName;
        this.stateTimer = duration;
        this.hasHit = false;
        if (this.y === GROUND_Y) this.vx = 0; 
    }

    isAttacking() {
        return ['punchA', 'punchB', 'kickX', 'kickY'].includes(this.state);
    }

    updatePoses(jx) {
        this.targetPose = { ...DEFAULT_POSE };

        if (this.state === 'walk') {
            let swing = Math.sin(Date.now() / 100) * 40;
            this.targetPose.lShoulder = -50 + swing;
            this.targetPose.rShoulder = -50 - swing;
            this.targetPose.lHip = -10 - swing;
            this.targetPose.rHip = -10 + swing;
            this.targetPose.lKnee = 20;
            this.targetPose.rKnee = 20;
            this.targetPose.trunkTilt = 15;
        } else if (this.y < GROUND_Y && !this.isAttacking() && this.state !== 'spin') {
            this.targetPose.lHip = -60; this.targetPose.lKnee = 100; 
            this.targetPose.rHip = 10; this.targetPose.rKnee = 80;
            this.targetPose.lShoulder = -120; this.targetPose.rShoulder = 120; 
        } else if (this.state === 'punchA') {
            this.targetPose.lShoulder = -90; 
            this.targetPose.lElbow = 0;      
            this.targetPose.rShoulder = -30; 
            this.targetPose.trunkTilt = 20;
        } else if (this.state === 'punchB') {
            let progress = this.stateTimer / 30; 
            if (progress > 0.5) { 
                this.targetPose.rShoulder = 180; this.targetPose.rElbow = -90;
                this.targetPose.lShoulder = -90;
            } else { 
                this.targetPose.rShoulder = -90; this.targetPose.rElbow = 0;
                this.targetPose.lShoulder = 120;
                this.targetPose.trunkTilt = 30;
            }
        } else if (this.state === 'kickX') {
            this.targetPose.lHip = -90; this.targetPose.lKnee = 0;
            this.targetPose.rHip = 10; this.targetPose.rKnee = 20;
            this.targetPose.trunkTilt = -10;
        } else if (this.state === 'kickY') {
            let progress = this.stateTimer / 35;
            if (progress > 0.6) { 
                this.targetPose.rHip = -90; this.targetPose.rKnee = 120;
                this.targetPose.trunkTilt = 0;
            } else { 
                this.targetPose.rHip = -120; this.targetPose.rKnee = 0;
                this.targetPose.trunkTilt = -30;
            }
        } else if (this.state === 'spin') {
            this.targetPose.lShoulder = -90; this.targetPose.rShoulder = -90;
            this.targetPose.lElbow = 0; this.targetPose.rElbow = 0;
            this.targetPose.lHip = -30; this.targetPose.rHip = -30;
            this.targetPose.trunkTilt = 0;
        }
    }

    checkHit(opponent) {
        if (this.hasHit || opponent.hp <= 0) return;

        let strikePoint = null;
        let damage = 0;

        if (this.state === 'punchA') { strikePoint = this.limbs.lHand; damage = 5; }
        else if (this.state === 'punchB') { strikePoint = this.limbs.rHand; damage = 15; }
        else if (this.state === 'kickX') { strikePoint = this.limbs.lFoot; damage = 8; }
        else if (this.state === 'kickY') { strikePoint = this.limbs.rFoot; damage = 20; }
        else if (this.state === 'spin') { 
            if (this.stateTimer % 15 === 0) this.hasHit = false; 
            strikePoint = this.limbs.lHand; 
            damage = 5; 
        }

        if (strikePoint) {
            let ob = opponent.bodyBox;
            if (strikePoint.x > ob.x && strikePoint.x < ob.x + ob.w &&
                strikePoint.y > ob.y && strikePoint.y < ob.y + ob.h) {
                
                opponent.takeDamage(damage);
                this.hasHit = true;

                let dir = (strikePoint.x > opponent.x) ? -1 : 1;
                opponent.vx = dir * (damage * 0.5);
                opponent.vy = -3;
            }
        }
    }

    takeDamage(amount) {
        if (this.hp <= 0) return;
        this.hp -= amount;
        if (this.hp < 0) this.hp = 0;
        const healthBar = document.getElementById(`${this.id.toLowerCase()}-health`);
        const percent = (this.hp / this.maxHp) * 100;
        healthBar.style.width = `${percent}%`;
        healthBar.style.background = percent > 30 ? '#00ff00' : '#ff0000';
    }

    drawLimbSegment(ctx, upperLen, lowerLen, angle1, angle2, saveName, dir) {
        ctx.rotate(toRad(angle1 * dir));
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, upperLen); ctx.stroke();
        
        ctx.translate(0, upperLen);
        ctx.rotate(toRad(angle2 * dir));
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, lowerLen); ctx.stroke();
        
        ctx.translate(0, lowerLen);
        this.saveLimbPos(saveName, ctx);
    }

    draw(ctx) {
        ctx.save();
        
        // Calculate procedural drop-to-floor offset for ragdoll
        let targetPelvisY = this.y - this.sizes.upperLeg - this.sizes.lowerLeg + 15;
        if (this.state === 'dead') targetPelvisY = this.y - 10;
        this.pelvisY = lerp(this.pelvisY || targetPelvisY, targetPelvisY, 0.2);

        ctx.translate(this.x, this.pelvisY);
        
        if (this.state === 'spin') {
            ctx.translate(0, -this.sizes.trunkH/2);
            ctx.rotate(toRad(this.globalRotation));
            ctx.translate(0, this.sizes.trunkH/2);
        }

        let dir = this.facingRight ? 1 : -1;
        let stickWidth = 8;
        let color = this.color;

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        // Neck offset calculated from rotated trunk
        let neckX = Math.sin(toRad(this.pose.trunkTilt * dir)) * this.sizes.trunkH;
        let neckY = -Math.cos(toRad(this.pose.trunkTilt * dir)) * this.sizes.trunkH;

        // Draw Back Arm
        ctx.save();
        ctx.translate(neckX, neckY);
        ctx.strokeStyle = '#999'; ctx.lineWidth = stickWidth;
        this.drawLimbSegment(ctx, this.sizes.upperArm, this.sizes.lowerArm, this.pose.rShoulder, this.pose.rElbow, 'rHand', dir);
        ctx.restore();

        // Draw Back Leg
        ctx.save();
        ctx.strokeStyle = '#999'; ctx.lineWidth = stickWidth;
        this.drawLimbSegment(ctx, this.sizes.upperLeg, this.sizes.lowerLeg, this.pose.rHip, this.pose.rKnee, 'rFoot', dir);
        ctx.restore();

        // Draw Trunk
        ctx.save();
        ctx.rotate(toRad(this.pose.trunkTilt * dir));
        ctx.strokeStyle = color; ctx.lineWidth = stickWidth + 1;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -this.sizes.trunkH); ctx.stroke();

        // Inside Trunk context: Draw Head at neck position
        ctx.translate(0, -this.sizes.trunkH);
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(0, -this.sizes.head, this.sizes.head, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'white'; // Eye
        ctx.beginPath(); ctx.arc(dir * 6, -this.sizes.head - 3, 3, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        // Draw Front Arm
        ctx.save();
        ctx.translate(neckX, neckY);
        ctx.strokeStyle = color; ctx.lineWidth = stickWidth;
        this.drawLimbSegment(ctx, this.sizes.upperArm, this.sizes.lowerArm, this.pose.lShoulder, this.pose.lElbow, 'lHand', dir);
        ctx.restore();

        // Draw Front Leg
        ctx.save();
        ctx.strokeStyle = color; ctx.lineWidth = stickWidth;
        this.drawLimbSegment(ctx, this.sizes.upperLeg, this.sizes.lowerLeg, this.pose.lHip, this.pose.lKnee, 'lFoot', dir);
        ctx.restore();

        ctx.restore();
    }

    saveLimbPos(name, ctx) {
        let matrix = ctx.getTransform();
        this.limbs[name].x = matrix.e;
        this.limbs[name].y = matrix.f;
    }
}

const p1 = new HumanoidFighter(300, 'P1', '#3498db', false);
const p2 = new HumanoidFighter(900, 'P2', '#e74c3c', true);

function animate() {
    requestAnimationFrame(animate);
    
    ctx.fillStyle = '#333';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#555';
    ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

    p1.update(p2);
    p2.update(p1);
    
    p2.draw(ctx);
    p1.draw(ctx);

    if (p1.hp <= 0 || p2.hp <= 0) {
        ctx.fillStyle = 'white';
        ctx.font = '60px Arial';
        ctx.textAlign = 'center';
        let winner = p1.hp > 0 ? "YOU WIN!" : "DUMMY WINS!";
        ctx.fillText(winner, canvas.width/2, canvas.height/2 - 100);
    }
}

animate();
</script>
</body>
</html>
