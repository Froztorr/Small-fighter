name: Apply movement upgrade

on:
  push:
    paths:
      - 'patches/movement-upgrade.patch'
      - '.github/workflows/apply-movement-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop if already applied
        id: check
        shell: bash
        run: |
          if grep -q 'prejumpFrames' index.html && grep -q 'wantsThrow(inp)' index.html; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply patch
        if: steps.check.outputs.applied == 'false'
        run: git apply patches/movement-upgrade.patch

      - name: Commit changes
        if: steps.check.outputs.applied == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Implement natural fighter movement upgrades"
          git push
